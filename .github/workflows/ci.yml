name: CI Process

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma Client
        run: npx prisma generate --schema ./src/prisma/schema.prisma

      - name: Lint check (Kiểm tra lỗi trình bày code)
        run: npx nx lint api

      - name: Build check (Thử build xem có lỗi không)
        run: npx nx build api --prod
