version: '3.8'

services:
  db:
    image: mongo:latest
    container_name: mongodb-production
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db # <--- Đảm bảo có dấu / ở đây

  api:
    build: .
    image: conduit-app:v1
    container_name: conduit-api
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=production
      - DATABASE_URL=mongodb://db:27017/conduit?authSource=admin
      - SECRET=12345678#
    depends_on:
      - db

volumes:
  mongo-data:
